# MiniChat Docker Compose Configuration
# Designed for Local Development & DevOps Portfolio Verification
#
# Services included:
#   1. frontend: Nginx container serving React SPA + reverse-proxying /api and /socket.io
#   2. backend:  Node.js Express + Socket.IO server with Redis Adapter
#   3. postgres: PostgreSQL 16 database for permanent message and user storage
#   4. redis:    Redis 7 for Pub/Sub inter-instance event broker and online presence
#
# NOTE: To test multi-replica horizontal scalability across backends, you can run:
#   docker compose up --scale backend=2

version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: minichat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-minichat}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Automatically initialize database schema on first run
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-minichat}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - minichat-net

  # ----------------------------------------------------
  # 2. Redis Pub/Sub & Ephemeral State
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: minichat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - minichat-net

  # ----------------------------------------------------
  # 3. Backend Application Server (Horizontally Scalable)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minichat-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-minichat}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-minichat-super-secure-devops-portfolio-secret-key-32chars}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - minichat-net

  # ----------------------------------------------------
  # 4. Frontend Web Server (Nginx Reverse Proxy)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minichat-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - minichat-net

volumes:
  postgres_data:
    name: minichat_postgres_data
  redis_data:
    name: minichat_redis_data

networks:
  minichat-net:
    name: minichat-network
    driver: bridge
